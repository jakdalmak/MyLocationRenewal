<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>ODsay 경로 콘솔</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
        }

        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
        }

        .content {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 54px);
            box-sizing: border-box;
        }

        .panel {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 14px;
            box-sizing: border-box;
            overflow-y: auto;
            background: #fff;
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .panel small {
            font-size: 11px;
            color: #666;
        }

        .form-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .form-row label {
            width: 70px;
            font-size: 12px;
            line-height: 24px;
        }

        .form-row input {
            flex: 1;
            padding: 3px 6px;
            font-size: 13px;
        }

        button {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            background: #f8f8f8;
        }

        button:hover {
            background: #eee;
        }

        .btn-small {
            font-size: 11px;
            padding: 4px 8px;
        }

        .pin-toggle-btn {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .pin-toggle-btn.pin-toggle-btn--active {
            background: #1f2937;
            color: #f9fafb;
            border-color: #111827;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #e5e7eb;
        }

        #route-summary {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .small-note {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            margin: 10px 0 4px;
        }

        .marker-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        .marker-dot--start {
            background: #2563eb;
        }

        .marker-dot--end {
            background: #ef4444;
        }

        /* 우측 컬럼 */
        .map-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .map-wrapper {
            flex: 1;
            min-height: 260px;
        }

        .spot-panel {
            max-height: 230px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .spot-panel h2 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .spot-table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #f9fafb;
            z-index: 1;
        }

        th, td {
            padding: 4px 6px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            white-space: nowrap;
        }

        tr:hover {
            background: #f3f4f6;
        }

        .spot-name-cell {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spot-empty {
            padding: 6px 8px;
            font-size: 12px;
            color: #6b7280;
        }

        .spot-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            font-size: 10px;
            color: #4b5563;
            background: #f9fafb;
        }

        /* 상세 경로 */
        .route-steps {
            margin-top: 6px;
        }

        .route-steps summary {
            cursor: pointer;
            font-size: 12px;
            color: #374151;
        }

        .route-steps ol {
            margin: 4px 0 0 18px;
            padding: 0;
            font-size: 12px;
        }

        /* step 태그 */
        .route-step-tag {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 4px;
            color: #fff;
        }

        .route-step-tag.bus {
            background: #10b981; /* 초록 */
        }

        .route-step-tag.subway {
            background: #6366f1; /* 남색 */
        }

        .route-step-tag.walk {
            background: #6b7280; /* 회색 WALK */
        }

    </style>
</head>
<body>
<div class="page">
    <header>
        <strong>ODsay 대중교통 경로 콘솔</strong>
        <span style="font-size: 12px; color: #666; margin-left: 8px;">
            (서울역 ↔ 김포공항역 예제)
        </span>
    </header>

    <div class="content">
        <!-- 좌측 패널 -->
        <section class="panel">
            <h2>출발 / 도착 좌표 입력</h2>

            <div style="font-size: 12px; margin-bottom: 6px;">
                KakaoMap에서 좌표 찍어서 넣어도 되고,<br/>
                기본으로는 서울역(공항철도) → 김포공항역(5호선 기준).
            </div>

            <h3 class="section-title">
                <span class="marker-dot marker-dot--start"></span>
                <span>출발 (SX,SY)</span>
            </h3>
            <div class="form-row">
                <label>위도(SY)</label>
                <input id="startLat" type="number" step="0.0000001"
                       th:value="${defaultStartLat}" />
            </div>
            <div class="form-row">
                <label>경도(SX)</label>
                <input id="startLng" type="number" step="0.0000001"
                       th:value="${defaultStartLng}" />
            </div>
            <div class="form-row">
                <label></label>
                <button id="btn-start-pin-mode" class="pin-toggle-btn btn-small">
                    출발 핀 위치 변경
                </button>
            </div>

            <h3 class="section-title">
                <span class="marker-dot marker-dot--end"></span>
                <span>도착 (EX,EY)</span>
            </h3>
            <div class="form-row">
                <label>위도(EY)</label>
                <input id="endLat" type="number" step="0.0000001"
                       th:value="${defaultEndLat}" />
            </div>
            <div class="form-row">
                <label>경도(EX)</label>
                <input id="endLng" type="number" step="0.0000001"
                       th:value="${defaultEndLng}" />
            </div>
            <div class="form-row">
                <label></label>
                <button id="btn-end-pin-mode" class="pin-toggle-btn btn-small">
                    도착 핀 위치 변경
                </button>
            </div>

            <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;">
                <button id="btn-set-seoul-gimpo">서울역 ↔ 김포공항 좌표 세팅</button>
                <button id="btn-search-route">대중교통 경로 조회</button>
            </div>

            <div class="small-note">
                * input 값은 그대로 ODsay SX,SY,EX,EY로 전달됨.<br/>
                * API 결과 중 최대 3개 경로까지 렌더링됨.
            </div>

            <div id="route-summary"></div>

            <div style="margin-top:6px;">
                <button id="btn-toggle-transfers" class="btn-small">
                    환승 핀 표시하기
                </button>
            </div>
        </section>

        <!-- 우측 지도 -->
        <section class="map-column">
            <div class="map-wrapper">
                <div id="map"></div>
            </div>

            <section class="panel spot-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>저장된 스팟 목록</h2>
                    <span class="spot-badge">미리보기 UI</span>
                </div>
                <small>
                    Spot 콘솔에서 등록한 스팟 기반. 출발/도착 스팟 기능 연동 예정.
                </small>

                <div class="spot-table-wrapper">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>이름</th>
                            <th>Lat</th>
                            <th>Lon</th>
                            <th>반경</th>
                        </tr>
                        </thead>
                        <tbody id="route-spot-table-body"></tbody>
                    </table>
                </div>

                <div id="route-spot-empty" class="spot-empty" style="display:none;">
                    아직 불러온 스팟이 없습니다.
                </div>
            </section>
        </section>
    </div>
</div>

<!-- route JS -->
<script th:src="@{/js/route-console.js}"></script>

<!-- Kakao Map SDK -->
<script th:src="@{|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoMapJsKey}&autoload=false&libraries=services|}"></script>

<script>
    kakao.maps.load(function () {
        initRouteConsole();
    });
</script>
</body>
</html>
